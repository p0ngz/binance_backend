openapi: 3.0.0
info:
  title: Binance Backend API
  version: 1.0.0
  description: |
    Binance-like Crypto Exchange Backend API

    ## Authentication
    - POST `/api/auth/login` เพื่อรับ `accessToken`
    - ใส่ token ในปุ่ม **Authorize** ด้านบน (ใส่แค่ token ไม่ต้องใส่ "Bearer ")
    - Access Token หมดอายุใน 15 นาที → ใช้ `/api/auth/refresh` เพื่อขอใหม่
    - Refresh Token เก็บใน httpOnly cookie อัตโนมัติ

    ## Seed Users (ทดสอบ)
    | Email | Password |
    |-------|----------|
    | alice@example.com | password123 |
    | bob@example.com | password123 |
    | charlie@example.com | password123 |

servers:
  - url: http://localhost:3500
    description: Local Development Server

tags:
  - name: auth
    description: Authentication — Register, Login, Logout, Refresh Token
  - name: user
    description: User Management — CRUD
  - name: currency
    description: Currency Management — CRUD (CRYPTO / FIAT)
  - name: market
    description: Market Pair Management — CRUD, Status Toggle
  - name: wallet
    description: Wallet Management — Balance, Deposit, Transfer, Create
  - name: order
    description: Order Management — Create (Limit/Market), Cancel, Order Book
  - name: trade
    description: Trade Queries — ผลลัพธ์จากการ Match Order (read-only)
  - name: transaction
    description: Transaction History — ทุก Transaction ในระบบ (read-only)
  - name: exchange-rate
    description: Exchange Rate — อัตราแลกเปลี่ยน CRUD (auto-reverse)
  - name: exchange
    description: Swap / Exchange — แลกเปลี่ยนสกุลเงินทันทีด้วย Exchange Rate

# ────────────────────────────────────────────
# Security
# ────────────────────────────────────────────
security:
  - bearerAuth: []

paths:
  # ══════════════════════════════════════════
  #  AUTH
  # ══════════════════════════════════════════
  /api/auth/register:
    post:
      summary: Register — สมัครสมาชิก
      description: |
        สร้างบัญชีผู้ใช้ใหม่ พร้อมสร้าง wallet ให้ทุก currency ที่มีในระบบ
      operationId: registerUser
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  minLength: 6
                  example: mypassword123
      responses:
        '201':
          description: สมัครสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: John Doe
                      email:
                        type: string
                        example: john@example.com
                      createdAt:
                        type: string
                        format: date-time
                      wallets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Wallet'
        '409':
          description: Email ซ้ำ

  /api/auth/login:
    post:
      summary: Login — เข้าสู่ระบบ
      description: |
        ล็อกอินด้วย email + password
        - ได้รับ `accessToken` (15 นาที) ใน response body
        - ได้รับ `refreshToken` (7 วัน) ใน httpOnly cookie ชื่อ `jwt`
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: alice@example.com
                password:
                  type: string
                  example: password123
            examples:
              alice:
                summary: Alice
                value: { email: alice@example.com, password: password123 }
              bob:
                summary: Bob
                value: { email: bob@example.com, password: password123 }
              charlie:
                summary: Charlie
                value: { email: charlie@example.com, password: password123 }
      responses:
        '200':
          description: เข้าสู่ระบบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Alice
                      email:
                        type: string
                        example: alice@example.com
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
          headers:
            Set-Cookie:
              description: httpOnly cookie `jwt` containing refresh token
              schema:
                type: string
        '401':
          description: Email หรือ Password ผิด

  /api/auth/refresh:
    get:
      summary: Refresh Token — ขอ Access Token ใหม่
      description: |
        ใช้ refresh token จาก cookie `jwt` เพื่อขอ access token ใหม่
        (ไม่ต้องส่ง body)
      operationId: refreshToken
      tags: [auth]
      security: []
      responses:
        '200':
          description: ได้ access token ใหม่
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: ไม่มี refresh token cookie
        '403':
          description: Refresh token ไม่ถูกต้องหรือหมดอายุ

  /api/auth/logout:
    post:
      summary: Logout — ออกจากระบบ (อุปกรณ์เดียว)
      description: ลบ refresh token ของ session ปัจจุบัน (จาก cookie `jwt`)
      operationId: logout
      tags: [auth]
      security: []
      responses:
        '204':
          description: ออกจากระบบสำเร็จ

  /api/auth/logout-all:
    post:
      summary: Logout All — ออกจากระบบทุกอุปกรณ์
      description: ลบ refresh token ทั้งหมดของ user (ต้องส่ง Authorization header)
      operationId: logoutAll
      tags: [auth]
      responses:
        '200':
          description: ออกจากระบบทุกอุปกรณ์สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out from 3 device(s)

  # ══════════════════════════════════════════
  #  USERS
  # ══════════════════════════════════════════
  /api/users:
    get:
      summary: Get All Users
      operationId: getAllUsers
      tags: [user]
      responses:
        '200':
          description: รายชื่อผู้ใช้ทั้งหมด
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/users/{id}:
    get:
      summary: Get User by ID
      operationId: getUserById
      tags: [user]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ข้อมูลผู้ใช้ พร้อม wallets และ socialAccounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      wallets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Wallet'
                      socialAccounts:
                        type: array
                        items:
                          type: object
        '404':
          description: ไม่พบผู้ใช้

    put:
      summary: Update User by ID
      operationId: updateUserById
      tags: [user]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Alice Updated
                email:
                  type: string
                  example: alice_new@example.com
                password:
                  type: string
                  example: newpassword123
                avatarUrl:
                  type: string
                  example: https://example.com/avatar.jpg
      responses:
        '200':
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: ไม่พบผู้ใช้

    delete:
      summary: Delete User by ID
      operationId: deleteUserById
      tags: [user]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted

  # ══════════════════════════════════════════
  #  CURRENCIES
  # ══════════════════════════════════════════
  /api/currencies:
    get:
      summary: Get All Currencies
      operationId: getAllCurrencies
      tags: [currency]
      responses:
        '200':
          description: รายการสกุลเงินทั้งหมด
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'

    post:
      summary: Create New Currency
      operationId: createCurrency
      tags: [currency]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, name, type]
              properties:
                symbol:
                  type: string
                  example: SOL
                name:
                  type: string
                  example: Solana
                type:
                  type: string
                  enum: [CRYPTO, FIAT]
                  example: CRYPTO
                precision:
                  type: integer
                  example: 8
                  description: ทศนิยม (default 8)
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'

  /api/currencies/{id}:
    get:
      summary: Get Currency by ID
      operationId: getCurrencyById
      tags: [currency]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ข้อมูลสกุลเงิน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'
        '404':
          description: ไม่พบสกุลเงิน

    put:
      summary: Update Currency by ID
      operationId: updateCurrencyById
      tags: [currency]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum: [CRYPTO, FIAT]
                precision:
                  type: integer
      responses:
        '200':
          description: อัปเดตสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Currency'

    delete:
      summary: Delete Currency by ID
      operationId: deleteCurrencyById
      tags: [currency]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Currency deleted

  # ══════════════════════════════════════════
  #  MARKETS
  # ══════════════════════════════════════════
  /api/markets:
    get:
      summary: Get All Markets
      operationId: getAllMarkets
      tags: [market]
      responses:
        '200':
          description: รายการ market pairs ทั้งหมด
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'

    post:
      summary: Create New Market Pair
      description: สร้างคู่ตลาดใหม่ เช่น BTC/THB
      operationId: createMarket
      tags: [market]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseCurrencyId, quoteCurrencyId]
              properties:
                baseCurrencyId:
                  type: integer
                  example: 1
                  description: "Currency ID ของเหรียญ base (เช่น BTC)"
                quoteCurrencyId:
                  type: integer
                  example: 4
                  description: "Currency ID ของเหรียญ quote (เช่น THB)"
                status:
                  type: string
                  enum: [ACTIVE, PAUSED, CLOSED]
                  default: ACTIVE
            examples:
              btc_thb:
                summary: BTC/THB
                value: { baseCurrencyId: 1, quoteCurrencyId: 4 }
              eth_thb:
                summary: ETH/THB
                value: { baseCurrencyId: 2, quoteCurrencyId: 4 }
      responses:
        '201':
          description: สร้าง market pair สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'

  /api/markets/active:
    get:
      summary: Get Active Markets
      description: ดึง market ที่มีสถานะ ACTIVE เท่านั้น
      operationId: getActiveMarkets
      tags: [market]
      responses:
        '200':
          description: Markets ที่ ACTIVE
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'

  /api/markets/{id}:
    get:
      summary: Get Market by ID
      operationId: getMarketById
      tags: [market]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ข้อมูล market pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
        '404':
          description: ไม่พบ market

    delete:
      summary: Delete Market by ID
      operationId: deleteMarketById
      tags: [market]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Market deleted

  /api/markets/{id}/status:
    patch:
      summary: Update Market Status
      description: เปลี่ยนสถานะของ market pair (ACTIVE / PAUSED / CLOSED)
      operationId: updateMarketStatus
      tags: [market]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, PAUSED, CLOSED]
                  example: PAUSED
      responses:
        '200':
          description: อัปเดตสถานะสำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'

  # ══════════════════════════════════════════
  #  WALLETS
  # ══════════════════════════════════════════
  /api/wallets/user/{userId}:
    get:
      summary: Get Wallets by User ID
      description: ดึง wallets ทั้งหมดของ user พร้อมข้อมูล currency
      operationId: getWalletsByUserId
      tags: [wallet]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: รายการ wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Wallet'

  /api/wallets/user/{userId}/currency/{currencyId}:
    get:
      summary: Get Wallet by User + Currency
      description: ดึง wallet เฉพาะคู่ userId + currencyId
      operationId: getWalletByUserAndCurrency
      tags: [wallet]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: currencyId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: ข้อมูล wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: ไม่พบ wallet

  /api/wallets:
    post:
      summary: Create New Wallet
      description: สร้าง wallet ใหม่ให้ user สำหรับ currency ที่ระบุ
      operationId: createWallet
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, currencyId]
              properties:
                userId:
                  type: integer
                  example: 1
                currencyId:
                  type: integer
                  example: 1
      responses:
        '201':
          description: สร้าง wallet สำเร็จ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /api/wallets/create-all/{userId}:
    post:
      summary: Create All Wallets for User
      description: |
        สร้าง wallet ให้ user สำหรับทุก currency ที่ยังไม่มี
        (ถ้ามีอยู่แล้วจะข้ามไป ไม่ error)
      operationId: createAllWalletsForUser
      tags: [wallet]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '201':
          description: สร้าง wallets สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Created 3 wallet(s) for user 1 (3 already existed)

  /api/wallets/deposit:
    post:
      summary: Deposit — เติมเงินเข้า Wallet
      description: |
        เพิ่ม balance ให้ wallet ของ user
        พร้อมสร้าง Transaction record (type: DEPOSIT, direction: IN)
      operationId: deposit
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, currencyId, amount]
              properties:
                userId:
                  type: integer
                  example: 1
                currencyId:
                  type: integer
                  example: 1
                  description: "Currency ID (1=BTC, 2=ETH, 3=XRP, 4=THB, 5=USD, 6=DOGE)"
                amount:
                  type: number
                  example: 0.5
            examples:
              deposit_btc:
                summary: Deposit 0.5 BTC ให้ Alice
                value: { userId: 1, currencyId: 1, amount: 0.5 }
              deposit_thb:
                summary: Deposit 100,000 THB ให้ Alice
                value: { userId: 1, currencyId: 4, amount: 100000 }
      responses:
        '200':
          description: เติมเงินสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Deposit successful
                  userId:
                    type: integer
                    example: 1
                  currency:
                    type: string
                    example: BTC
                  deposited:
                    type: number
                    example: 0.5
                  balanceAfter:
                    type: number
                    example: 2.5

  /api/wallets/transfer:
    post:
      summary: Transfer — โอนเงินระหว่าง Users
      description: |
        โอนเงินจาก user หนึ่งไปยังอีก user
        สร้าง 2 Transaction records (sender OUT, receiver IN)
      operationId: transfer
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senderId, receiverId, currencyId, amount]
              properties:
                senderId:
                  type: integer
                  example: 1
                receiverId:
                  type: integer
                  example: 2
                currencyId:
                  type: integer
                  example: 4
                  description: "Currency ID"
                amount:
                  type: number
                  example: 50000
            examples:
              transfer_thb:
                summary: Alice โอน 50,000 THB ให้ Bob
                value: { senderId: 1, receiverId: 2, currencyId: 4, amount: 50000 }
              transfer_btc:
                summary: Bob โอน 0.1 BTC ให้ Charlie
                value: { senderId: 2, receiverId: 3, currencyId: 1, amount: 0.1 }
      responses:
        '200':
          description: โอนเงินสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transfer successful
                  sender:
                    type: object
                    properties:
                      userId:
                        type: integer
                      balanceAfter:
                        type: number
                  receiver:
                    type: object
                    properties:
                      userId:
                        type: integer
                      balanceAfter:
                        type: number
                  currency:
                    type: string
                    example: THB
                  amount:
                    type: number
                    example: 50000

  # ══════════════════════════════════════════
  #  ORDERS
  # ══════════════════════════════════════════
  /api/orders/user/{userId}:
    get:
      summary: Get Orders by User ID
      operationId: getOrdersByUserId
      tags: [order]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: รายการ orders ของ user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/orders/market/{marketId}/book:
    get:
      summary: Get Order Book — ดู Bids/Asks ของตลาด
      description: |
        ดึง order book ของ market
        - **bids** = คำสั่ง BUY ที่รอ (เรียงราคาสูง→ต่ำ)
        - **asks** = คำสั่ง SELL ที่รอ (เรียงราคาต่ำ→สูง)
      operationId: getOrderBook
      tags: [order]
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: integer
          example: 1
          description: "Market ID (1=BTC/THB, 2=ETH/THB, ...)"
      responses:
        '200':
          description: Order book
          content:
            application/json:
              schema:
                type: object
                properties:
                  bids:
                    type: array
                    description: "BUY orders (ราคาสูง→ต่ำ)"
                    items:
                      $ref: '#/components/schemas/Order'
                  asks:
                    type: array
                    description: "SELL orders (ราคาต่ำ→สูง)"
                    items:
                      $ref: '#/components/schemas/Order'

  /api/orders/{id}:
    get:
      summary: Get Order by ID
      description: ดึง order พร้อม trades ที่เกี่ยวข้อง
      operationId: getOrderById
      tags: [order]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ข้อมูล order พร้อม trades
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      buyTrades:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trade'
                      sellTrades:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trade'

  /api/orders:
    post:
      summary: Create New Order — สร้างคำสั่งซื้อ/ขาย
      description: |
        สร้าง order ใหม่ ระบบจะทำสิ่งเหล่านี้อัตโนมัติ:
        1. **Lock balance** — หักเงินจาก balance ไปเก็บใน lockBalance
        2. **Try Match** — ค้นหา order ฝั่งตรงข้ามที่ราคาตรง แล้วสร้าง trade
        3. **Self-trade prevention** — ไม่ match กับ order ของตัวเอง

        ### ตัวอย่าง Side + Type
        | Side | Type | price | ผลลัพธ์ |
        |------|------|-------|---------|
        | BUY | LIMIT | ต้องระบุ | ตั้งซื้อที่ราคาที่กำหนด |
        | BUY | MARKET | ไม่ต้อง (ดึงจาก exchange rate) | ซื้อทันทีที่ราคาตลาด |
        | SELL | LIMIT | ต้องระบุ | ตั้งขายที่ราคาที่กำหนด |
        | SELL | MARKET | ไม่ต้อง (ดึงจาก exchange rate) | ขายทันทีที่ราคาตลาด |

        ### filledType
        - **SINGLE** — match ได้ครั้งเดียว (1 opposing order)
        - **MULTIPLE** — match ได้หลายครั้ง (หลาย opposing orders)
      operationId: createOrder
      tags: [order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, marketId, side, type, amount]
              properties:
                userId:
                  type: integer
                  example: 1
                marketId:
                  type: integer
                  example: 1
                  description: "Market ID (1=BTC/THB, 2=ETH/THB, ...)"
                side:
                  type: string
                  enum: [BUY, SELL]
                  example: BUY
                type:
                  type: string
                  enum: [LIMIT, MARKET]
                  example: LIMIT
                price:
                  type: number
                  example: 3000000
                  description: "ต้องระบุสำหรับ LIMIT order (MARKET จะดึงจาก exchange rate อัตโนมัติ)"
                amount:
                  type: number
                  example: 0.5
                  description: "จำนวน base currency"
                filledType:
                  type: string
                  enum: [SINGLE, MULTIPLE]
                  default: SINGLE
            examples:
              buy_limit_btc:
                summary: "BUY LIMIT — ซื้อ 0.5 BTC ที่ราคา 3,000,000 THB"
                value:
                  userId: 1
                  marketId: 1
                  side: BUY
                  type: LIMIT
                  price: 3000000
                  amount: 0.5
              sell_limit_btc:
                summary: "SELL LIMIT — ขาย 0.5 BTC ที่ราคา 3,000,000 THB"
                value:
                  userId: 2
                  marketId: 1
                  side: SELL
                  type: LIMIT
                  price: 3000000
                  amount: 0.5
              buy_market_btc:
                summary: "BUY MARKET — ซื้อ 0.1 BTC ที่ราคาตลาด"
                value:
                  userId: 1
                  marketId: 1
                  side: BUY
                  type: MARKET
                  amount: 0.1
              sell_market_btc:
                summary: "SELL MARKET — ขาย 0.1 BTC ที่ราคาตลาด"
                value:
                  userId: 2
                  marketId: 1
                  side: SELL
                  type: MARKET
                  amount: 0.1
              buy_limit_multiple:
                summary: "BUY LIMIT MULTIPLE — ซื้อ 1 BTC (match หลาย orders)"
                value:
                  userId: 1
                  marketId: 1
                  side: BUY
                  type: LIMIT
                  price: 3100000
                  amount: 1
                  filledType: MULTIPLE
              buy_limit_eth:
                summary: "BUY LIMIT — ซื้อ 2 ETH ที่ราคา 100,000 THB (market 2)"
                value:
                  userId: 1
                  marketId: 2
                  side: BUY
                  type: LIMIT
                  price: 100000
                  amount: 2
              sell_limit_eth:
                summary: "SELL LIMIT — ขาย 2 ETH ที่ราคา 100,000 THB (market 2)"
                value:
                  userId: 2
                  marketId: 2
                  side: SELL
                  type: LIMIT
                  price: 100000
                  amount: 2
      responses:
        '201':
          description: |
            สร้าง order สำเร็จ
            - ถ้า match ได้ จะมี trades ใน buyTrades/sellTrades
            - ถ้า match ไม่ได้ จะเป็น OPEN order รอใน order book
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      buyTrades:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trade'
                      sellTrades:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trade'
        '400':
          description: Validation error หรือ balance ไม่พอ

  /api/orders/{id}/cancel:
    patch:
      summary: Cancel Order — ยกเลิกคำสั่ง
      description: |
        ยกเลิก order ที่มีสถานะ OPEN
        - คืน lockBalance กลับเป็น balance
        - เปลี่ยนสถานะเป็น CANCELLED
      operationId: cancelOrder
      tags: [order]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: integer
                  example: 1
                  description: "ต้องเป็นเจ้าของ order"
      responses:
        '200':
          description: ยกเลิกสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order cancelled
                  order:
                    $ref: '#/components/schemas/Order'

  # ══════════════════════════════════════════
  #  TRADES  (read-only — สร้างจากระบบ matching)
  # ══════════════════════════════════════════
  /api/trades/market/{marketId}:
    get:
      summary: Get Trades by Market ID
      description: ดึง trade history ของตลาด
      operationId: getTradesByMarketId
      tags: [trade]
      parameters:
        - name: marketId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: รายการ trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'

  /api/trades/user/{userId}:
    get:
      summary: Get Trades by User ID
      description: ดึง trades ทั้งหมดที่ user มีส่วนเกี่ยวข้อง (ทั้ง buyer และ seller)
      operationId: getTradesByUserId
      tags: [trade]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: รายการ trades ของ user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'

  /api/trades/{id}:
    get:
      summary: Get Trade by ID
      operationId: getTradeById
      tags: [trade]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: รายละเอียด trade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'

  # ══════════════════════════════════════════
  #  TRANSACTIONS  (read-only)
  # ══════════════════════════════════════════
  /api/transactions/user/{userId}:
    get:
      summary: Get Transactions by User ID
      description: |
        ดึง transactions ทั้งหมดของ user พร้อม populate `ref` ตาม refType:
        - **ORDER** → ข้อมูล Order
        - **TRADE** → ข้อมูล Trade
        - **EXCHANGE** → ข้อมูล Transaction ที่เกี่ยวข้อง
      operationId: getTransactionsByUserId
      tags: [transaction]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: รายการ transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /api/transactions/{id}:
    get:
      summary: Get Transaction by ID
      operationId: getTransactionById
      tags: [transaction]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: รายละเอียด transaction พร้อม ref
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  # ══════════════════════════════════════════
  #  EXCHANGE RATES
  # ══════════════════════════════════════════
  /api/exchange-rates:
    get:
      summary: Get All Exchange Rates
      operationId: getAllExchangeRates
      tags: [exchange-rate]
      responses:
        '200':
          description: อัตราแลกเปลี่ยนทั้งหมด
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeRate'

    post:
      summary: Create / Update Exchange Rate (auto-reverse)
      description: |
        สร้างหรืออัปเดตอัตราแลกเปลี่ยน
        - ระบบจะสร้าง/อัปเดต **ทั้งสองทิศทาง** อัตโนมัติ
        - เช่น ใส่ BTC→THB = 3,000,000 จะได้ THB→BTC = 0.00000033 ด้วย
      operationId: upsertExchangeRate
      tags: [exchange-rate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromCurrencyId, toCurrencyId, rate]
              properties:
                fromCurrencyId:
                  type: integer
                  example: 1
                  description: "Currency ID ต้นทาง (1=BTC)"
                toCurrencyId:
                  type: integer
                  example: 4
                  description: "Currency ID ปลายทาง (4=THB)"
                rate:
                  type: number
                  example: 3000000
                  description: "1 หน่วย fromCurrency = rate หน่วย toCurrency"
            examples:
              btc_to_thb:
                summary: "BTC → THB = 3,000,000"
                value: { fromCurrencyId: 1, toCurrencyId: 4, rate: 3000000 }
              eth_to_thb:
                summary: "ETH → THB = 100,000"
                value: { fromCurrencyId: 2, toCurrencyId: 4, rate: 100000 }
              btc_to_usd:
                summary: "BTC → USD = 85,000"
                value: { fromCurrencyId: 1, toCurrencyId: 5, rate: 85000 }
      responses:
        '200':
          description: สร้าง/อัปเดตสำเร็จ (ทั้งสองทิศทาง)
          content:
            application/json:
              schema:
                type: object
                properties:
                  forward:
                    $ref: '#/components/schemas/ExchangeRate'
                  reverse:
                    $ref: '#/components/schemas/ExchangeRate'

  /api/exchange-rates/{id}:
    get:
      summary: Get Exchange Rate by ID
      operationId: getExchangeRateById
      tags: [exchange-rate]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: อัตราแลกเปลี่ยน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'

    delete:
      summary: Delete Exchange Rate
      operationId: deleteExchangeRate
      tags: [exchange-rate]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: ลบสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Exchange rate deleted

  /api/exchange-rates/pair/{fromCurrencyId}/{toCurrencyId}:
    get:
      summary: Get Exchange Rate by Currency Pair
      description: ดึงอัตราแลกเปลี่ยนจาก currency ID คู่
      operationId: getExchangeRateByPair
      tags: [exchange-rate]
      parameters:
        - name: fromCurrencyId
          in: path
          required: true
          schema:
            type: integer
          example: 1
          description: "Currency ID ต้นทาง"
        - name: toCurrencyId
          in: path
          required: true
          schema:
            type: integer
          example: 4
          description: "Currency ID ปลายทาง"
      responses:
        '200':
          description: อัตราแลกเปลี่ยน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        '404':
          description: ไม่พบอัตราแลกเปลี่ยนสำหรับคู่นี้

  # ══════════════════════════════════════════
  #  EXCHANGE / SWAP
  # ══════════════════════════════════════════
  /api/exchange:
    post:
      summary: Swap / Exchange Currency — แลกเงินทันที
      description: |
        แลกเปลี่ยนสกุลเงินทันทีตาม exchange rate ในระบบ
        (ไม่ผ่าน order book — ใช้ rate จากตาราง ExchangeRate)

        ### ตัวอย่าง
        - แลก 1 BTC → THB → ได้ 3,000,000 THB (ตาม rate)
        - แลก 100,000 THB → ETH → ได้ 1 ETH (ตาม rate)
      operationId: exchangeWithMarket
      tags: [exchange]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, fromCurrencyId, toCurrencyId, amount]
              properties:
                userId:
                  type: integer
                  example: 1
                fromCurrencyId:
                  type: integer
                  example: 1
                  description: "Currency ID ที่ต้องการขาย"
                toCurrencyId:
                  type: integer
                  example: 4
                  description: "Currency ID ที่ต้องการซื้อ"
                amount:
                  type: number
                  example: 0.5
                  description: "จำนวน fromCurrency ที่ต้องการแลก"
            examples:
              btc_to_thb:
                summary: "Alice แลก 0.5 BTC → THB"
                value: { userId: 1, fromCurrencyId: 1, toCurrencyId: 4, amount: 0.5 }
              thb_to_eth:
                summary: "Bob แลก 100,000 THB → ETH"
                value: { userId: 2, fromCurrencyId: 4, toCurrencyId: 2, amount: 100000 }
              usd_to_btc:
                summary: "Charlie แลก 10,000 USD → BTC"
                value: { userId: 3, fromCurrencyId: 5, toCurrencyId: 1, amount: 10000 }
      responses:
        '200':
          description: แลกเปลี่ยนสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Exchange successful
                  from:
                    type: object
                    properties:
                      currency:
                        type: string
                        example: BTC
                      amount:
                        type: number
                        example: 0.5
                      balanceAfter:
                        type: number
                        example: 1.5
                  to:
                    type: object
                    properties:
                      currency:
                        type: string
                        example: THB
                      amount:
                        type: number
                        example: 1500000
                      balanceAfter:
                        type: number
                        example: 6500000
                  rate:
                    type: number
                    example: 3000000
        '400':
          description: Balance ไม่พอ หรือไม่พบ exchange rate

# ════════════════════════════════════════════
#  COMPONENTS
# ════════════════════════════════════════════
components:
  # ─── Security ─────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ใช้ accessToken ที่ได้จาก Login
        กดปุ่ม Authorize แล้ววาง token (ไม่ต้องใส่ "Bearer ")

  # ─── Parameters ───────────────────────────
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
      description: Resource ID

  # ─── Schemas ──────────────────────────────
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          example: alice@example.com
        avatarUrl:
          type: string
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Currency:
      type: object
      properties:
        id:
          type: integer
          example: 1
        symbol:
          type: string
          example: BTC
        name:
          type: string
          example: Bitcoin
        type:
          type: string
          enum: [CRYPTO, FIAT]
          example: CRYPTO
        precision:
          type: integer
          example: 8

    Wallet:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        currencyId:
          type: integer
          example: 1
        balance:
          type: number
          example: 2.0
          description: "ยอดคงเหลือที่ใช้ได้"
        lockBalance:
          type: number
          example: 0.5
          description: "ยอดที่ถูก lock ไว้สำหรับ order"
        updatedAt:
          type: string
          format: date-time
        currency:
          $ref: '#/components/schemas/Currency'

    Market:
      type: object
      properties:
        id:
          type: integer
          example: 1
        baseCurrencyId:
          type: integer
          example: 1
        quoteCurrencyId:
          type: integer
          example: 4
        status:
          type: string
          enum: [ACTIVE, PAUSED, CLOSED]
          example: ACTIVE
        baseCurrency:
          $ref: '#/components/schemas/Currency'
        quoteCurrency:
          $ref: '#/components/schemas/Currency'

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        marketId:
          type: integer
          example: 1
        side:
          type: string
          enum: [BUY, SELL]
          example: BUY
        type:
          type: string
          enum: [LIMIT, MARKET]
          example: LIMIT
        price:
          type: number
          example: 3000000
        amount:
          type: number
          example: 0.5
        filledAmount:
          type: number
          example: 0
          description: "จำนวนที่ match ไปแล้ว"
        filledType:
          type: string
          enum: [SINGLE, MULTIPLE]
          example: SINGLE
        status:
          type: string
          enum: [OPEN, FILLED, CANCELLED]
          example: OPEN
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        market:
          $ref: '#/components/schemas/Market'

    Trade:
      type: object
      properties:
        id:
          type: integer
          example: 1
        buyOrderId:
          type: integer
          example: 1
        sellOrderId:
          type: integer
          example: 2
        price:
          type: number
          example: 3000000
          description: "ราคาที่ match (ใช้ราคาของ maker)"
        amount:
          type: number
          example: 0.5
        fee:
          type: number
          example: 0
        createdAt:
          type: string
          format: date-time
        buyOrder:
          $ref: '#/components/schemas/Order'
        sellOrder:
          $ref: '#/components/schemas/Order'

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        currencyId:
          type: integer
          example: 1
        type:
          type: string
          enum: [TRADE, EXCHANGE, DEPOSIT, BONUS, TRANSFER]
          example: DEPOSIT
          description: |
            - TRADE = จาก order matching
            - EXCHANGE = จากการ swap
            - DEPOSIT = เติมเงิน
            - BONUS = โบนัส
            - TRANSFER = โอนระหว่าง users
        direction:
          type: string
          enum: [IN, OUT]
          example: IN
        amount:
          type: number
          example: 2.0
        balanceBefore:
          type: number
          example: 0
        balanceAfter:
          type: number
          example: 2.0
        refType:
          type: string
          enum: [ORDER, TRADE, EXCHANGE, TRANSFER, DEPOSIT]
          nullable: true
          example: DEPOSIT
          description: "ประเภทของ record อ้างอิง"
        refId:
          type: integer
          nullable: true
          example: null
          description: "ID ของ record อ้างอิง"
        createdAt:
          type: string
          format: date-time
        currency:
          $ref: '#/components/schemas/Currency'
        ref:
          type: object
          nullable: true
          description: "ข้อมูลอ้างอิงที่ populate ตาม refType"

    ExchangeRate:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fromCurrencyId:
          type: integer
          example: 1
        toCurrencyId:
          type: integer
          example: 4
        rate:
          type: number
          example: 3000000
          description: "1 fromCurrency = rate toCurrency"
        updatedAt:
          type: string
          format: date-time
        fromCurrency:
          $ref: '#/components/schemas/Currency'
        toCurrency:
          $ref: '#/components/schemas/Currency'
